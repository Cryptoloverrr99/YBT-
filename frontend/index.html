<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deriv YBT LH Monitor</title><script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script><style>body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui}header{padding:14px 18px;border-bottom:1px solid #26304a}.wrap{padding:14px}.card{background:#111827;border:1px solid #26304a;border-radius:12px;padding:12px}.muted{color:#94a3b8}#chart{height:65vh;margin-top:12px}</style></head><body><header><b>DERIV YBT LH MONITOR</b><span class="muted"> — H1 · H2 · H3 · H4</span></header><main class="wrap"><div class="card"><div id="status" class="muted">Dashboard prêt. Le scanner tourne côté serveur.</div><div id="chart"></div></div></main><script>const el=document.getElementById('chart');const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#111827'},textColor:'#cbd5e1'},grid:{vertLines:{color:'#1f2937'},horzLines:{color:'#1f2937'}},rightPriceScale:{borderColor:'#26304a'},timeScale:{borderColor:'#26304a'}});const series=chart.addSeries(LightweightCharts.CandlestickSeries);series.setData([]);window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight}));fetch('/health').then(r=>r.json()).then(x=>document.getElementById('status').textContent='Serveur : '+x.status).catch(()=>{});</script></body></html>
